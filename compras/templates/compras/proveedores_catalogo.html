{% extends 'general/base.html' %}
{% block title %}Proveedores | ERP Decorlata{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div><h2 class="fw-bold text-dark mb-0">Catálogo de Proveedores</h2></div>
    <button class="btn btn-primary px-4 shadow-sm" hx-get="{% url 'compras:proveedor_crear' %}" hx-target="#offcanvas-content" data-bs-toggle="offcanvas" data-bs-target="#offcanvasProveedor">
        <i class="bi bi-plus-lg me-2"></i> Nuevo Proveedor
    </button>
</div>

<div class="card border-0 shadow-sm mb-4">
    <div class="card-body p-3">
        <div class="input-group w-50">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" placeholder="Buscar por RFC o Razón Social..." name="q" hx-get="{% url 'compras:proveedores_catalogo' %}" hx-trigger="keyup changed delay:400ms" hx-target="#tabla-proveedores-container">
        </div>
    </div>
</div>

<!-- El atributo hx-trigger escucha el guardado para recargarse sola -->
<div id="tabla-proveedores-container" hx-get="{% url 'compras:proveedores_catalogo' %}" hx-trigger="proveedorGuardado from:body">
    {% include 'compras/partials/_tabla_proveedores.html' %}
</div>

<!-- Panel Offcanvas -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasProveedor" style="width: 450px;">
    <div class="offcanvas-header border-bottom bg-light">
        <h5 class="offcanvas-title fw-bold">Detalle de Proveedor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body" id="offcanvas-content"></div>
</div>

<script>
    document.body.addEventListener('proveedorGuardado', function(evt) {
        bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasProveedor'))?.hide();
        document.querySelectorAll('.offcanvas-backdrop').forEach(el => el.remove());
    });
</script>
{% endblock %}
